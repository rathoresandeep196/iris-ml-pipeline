name: ML Training with CML

on:
  pull_request:
    branches: [main]

jobs:
  run-ml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Train the model
        run: |
          python src/train.py

      - name: Evaluate model and write result to file
        run: |
          ACCURACY=$(python -c "from src.evaluate import evaluate_model; print(evaluate_model())")
          echo "### ✅ Model Accuracy: $ACCURACY" > report.md

      - name: Install CML
        run: npm install -g @dvcorg/cml

      - name: Post accuracy report to PR
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create report.md
